name: Apply Prisma Migrations (Production)

# THIS CHANGES THE PRODUCTION DATABASE. It is the ONLY path that applies
# migrations to production, and it never runs by itself.
#
# It's a separate, explicit, approved release step (see docs/migrations.md):
#   - started by hand (Actions → "Apply Prisma Migrations (Production)" →
#     Run workflow), from the main branch only;
#   - requires typing the confirmation phrase below exactly;
#   - prints `prisma migrate status` (read-only) before applying anything.
# Application builds (npm run build, Vercel, CI) do NOT migrate any database.
# Before 2026-11-23 this ran automatically on every push to main that touched
# prisma/migrations/, and the Vercel build also migrated; both were removed
# so a merge or a Preview deployment can never change production by itself.
#
# Required secret (GitHub → Settings → Environments → production → Secrets):
#   DIRECT_URL — direct (non-pooled) Neon connection string used by the
#                Prisma CLI. Add required reviewers to the "production"
#                environment for a second approval gate.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: apply production migrations'
        required: true
        type: string

jobs:
  migrate:
    name: prisma migrate deploy → production
    runs-on: ubuntu-latest
    environment: production
    # Refuse anything but a deliberate run from main with the exact phrase.
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'apply production migrations'

    # Job-level so it's available to EVERY step, including the implicit
    # `prisma generate` that `npm ci` triggers via package.json's
    # "postinstall" script. That implicit run loads prisma.config.ts, which
    # calls env("DIRECT_URL") just to resolve the config — it used to only
    # be set on the later explicit steps, so `npm ci`'s postinstall failed
    # before ever reaching them ("Cannot resolve environment variable:
    # DIRECT_URL"). See the 2026-08-17 CI-failure fix in HANDOFF.md.
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (LTS). Do not downgrade to 20 — deprecated in GitHub
          # Actions runner images as of mid-2025.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail immediately with a clear message if the secret is absent.
      # An empty secret causes a confusing Prisma error deep in the run.
      - name: Verify DIRECT_URL secret is configured
        run: |
          if [ -z "${DIRECT_URL}" ]; then
            echo ""
            echo "ERROR ─────────────────────────────────────────────────────────"
            echo ""
            echo "  The DIRECT_URL secret is not set for the 'production'"
            echo "  GitHub environment."
            echo ""
            echo "  Add it at:"
            echo "  GitHub → Repository Settings → Environments → production"
            echo "           → Environment secrets → DIRECT_URL"
            echo ""
            echo "  Value: the direct (non-pooled) Neon connection string."
            echo "  Example format:"
            echo "    postgresql://user:pass@ep-xxx.region.aws.neon.tech/db"
            echo "             ?sslmode=require&channel_binding=require"
            echo ""
            echo "────────────────────────────────────────────────────────────────"
            exit 1
          fi
          echo "OK: DIRECT_URL is set."

      # prisma generate reads schema.prisma and produces the TypeScript client.
      # It does not connect to the database.
      - name: Generate Prisma client
        run: npx prisma generate

      # Read-only: lists exactly which migrations are about to be applied,
      # so the run log records what changed. Exits non-zero when migrations
      # are pending, which is expected here, hence continue-on-error.
      - name: Show pending migrations (read-only)
        run: npx prisma migrate status
        continue-on-error: true

      # Apply all pending migrations. Already-applied migrations are skipped.
      # Uses DIRECT_URL (non-pooled) as required by the Prisma CLI
      # (prisma.config.ts datasource.url = env("DIRECT_URL")).
      - name: Apply migrations
        run: npx prisma migrate deploy
